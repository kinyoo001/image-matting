name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview loguru pydantic-settings numpy tinify "psd-tools>=1.10" onnxruntime-directml opencv-python fastapi "uvicorn>=0.34" httpx pillow requests

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend into backend/web
        working-directory: backend
        # 注:build.py 会先尝试 pnpm(失败忽略),然后把 ../frontend/dist 拷到 ./web
        run: python build.py -t f

      - name: Download RMBG-1.4 model
        working-directory: backend
        run: python hub_model/download.py

      - name: Check downloaded model
        working-directory: backend
        run: |
          Get-ChildItem hub_model/briaai/RMBG-1.4
          if (-not (Test-Path "hub_model/briaai/RMBG-1.4/model.onnx")) { throw "model download failed" }

      - name: Build exe with PyInstaller
        working-directory: backend
        run: pyinstaller --noconfirm --clean main.spec --distpath dist/release

      - name: Verify output
        working-directory: backend
        run: |
          Get-ChildItem dist/release/小颖AI抠图
          Get-ChildItem dist/release/小颖AI抠图/_internal -Recurse -File | Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize
          if (-not (Test-Path "dist/release/小颖AI抠图/ImageMatting.exe")) { throw "ImageMatting.exe not found" }
          # PyInstaller 6 one-dir 布局:资源都在 _internal 下
          if (-not (Test-Path "dist/release/小颖AI抠图/_internal/hub_model/briaai/RMBG-1.4/model.onnx")) { throw "bundled model not found" }
          if (-not (Test-Path "dist/release/小颖AI抠图/_internal/hub_model/rmodel/model.onnx")) { throw "inpainting model not found" }
          if (-not (Test-Path "dist/release/小颖AI抠图/_internal/web/index.html")) { throw "frontend not found" }

      - name: Zip portable package
        working-directory: backend/dist/release
        run: Compress-Archive -Path "小颖AI抠图" -DestinationPath "$env:GITHUB_WORKSPACE/XiaoYing-Matting-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoYing-Matting-win-x64
          path: XiaoYing-Matting-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: XiaoYing-Matting-win-x64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" XiaoYing-Matting-win-x64.zip --generate-notes
